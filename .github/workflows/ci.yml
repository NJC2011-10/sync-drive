name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
          shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Format check
        run: cargo fmt --all -- --check

      # 不用 -D warnings：滚动更新下 stable 新增 lint 会让 CI 无故变红。
      # 只阻断 correctness / suspicious，pedantic 仅提示。
      - name: Clippy check
        run: >
          cargo clippy --workspace --all-targets --all-features --locked
          -- -D clippy::correctness -D clippy::suspicious -W clippy::pedantic

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run doc-tests
        run: cargo test --doc --workspace --all-features --locked

      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --all-features --locked
